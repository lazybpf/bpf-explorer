syntax = "proto3";

package bpfinspector.v1;

option go_package = "github.com/lazybpf/bpf-explorer/gen/bpfinspectorv1;bpfinspectorv1";

// BpfInspector is the per-node, read-only inspection API served by the agent
// running inside the privileged DaemonSet pod. There is intentionally no RPC
// that mutates kernel state in v1 (no map update/delete, no prog load/detach).
// TraceLog is the one call that is not a pure read - see its comment.
service BpfInspector {
  rpc ListMaps(ListMapsRequest) returns (ListMapsResponse);
  rpc DumpMap(DumpMapRequest) returns (DumpMapResponse);
  rpc ListPrograms(ListProgramsRequest) returns (ListProgramsResponse);
  rpc DumpProgram(DumpProgramRequest) returns (DumpProgramResponse);
  rpc ListLinks(ListLinksRequest) returns (ListLinksResponse);
  rpc TraceLog(TraceLogRequest) returns (stream TraceLogEvent);
  rpc ResolveInode(ResolveInodeRequest) returns (ResolveInodeResponse);
  rpc DescribeProcess(DescribeProcessRequest) returns (DescribeProcessResponse);
  rpc DescribeNode(DescribeNodeRequest) returns (DescribeNodeResponse);
}

message MapInfo {
  uint32 id = 1;
  string name = 2;
  string type = 3;         // e.g. "Hash", "LRUHash", "PerCPUArray", "RingBuf"
  uint32 key_size = 4;
  uint32 value_size = 5;
  uint32 max_entries = 6;
  uint32 flags = 7;
  repeated string pinned_paths = 8; // e.g. /sys/fs/bpf/<agent>/<map>
  bool dumpable = 9;       // false for RingBuf/PerfEvent etc.
  repeated ProcessRef pids = 10;    // holders of an open fd to this map
  // Why this map cannot be dumped, for the UI to show; empty when dumpable.
  // Mirrors DumpProgramResponse.note, which serves the same purpose.
  string dump_note = 11;
  // For ArrayOfMaps/HashOfMaps only: the ids currently in its slots, the values
  // `bpftool map dump` prints as "inner_map_id". This is the one reference an
  // inner map may have no other trace of - a loader that inserts an inner map
  // and closes its fd leaves it with no holder, no pin and no referencing
  // program, so without this the UI cannot attribute it to anyone.
  repeated uint32 inner_map_ids = 12;
}

message ListMapsRequest {}
message ListMapsResponse { repeated MapInfo maps = 1; }

message MapEntry {
  string key_hex = 1;      // raw bytes, hex-encoded
  string key_fmt = 2;      // BTF-formatted, best-effort (may be empty)
  string value_hex = 3;
  string value_fmt = 4;
  // For per-CPU maps, one formatted value per CPU (value_fmt holds a summary).
  repeated string per_cpu_value_fmt = 5;
  // For a map-of-maps only: the inner map held in this slot, decoded from the
  // value bytes on the node - they are a host-order u32 id, which only the
  // agent can read as one. 0 for every other map type, and for an empty slot:
  // 0 is not a valid map id.
  uint32 inner_map_id = 6;
}

message DumpMapRequest {
  uint32 id = 1;
  uint32 limit = 2;        // page size; server applies a hard cap
  bytes cursor = 3;        // opaque; empty for first page
}

message DumpMapResponse {
  repeated MapEntry entries = 1;
  bytes next_cursor = 2;   // empty when exhausted
  bool truncated = 3;      // true if a server-side hard cap stopped the dump
}

// ProcessRef is a process holding a reference (open fd) to a BPF object,
// resolved by scanning /proc. Requires the agent to see host PIDs (hostPID).
message ProcessRef {
  uint32 pid = 1;
  string comm = 2;
}

message ProgramInfo {
  uint32 id = 1;
  string name = 2;
  string type = 3;
  string tag = 4;
  repeated uint32 map_ids = 5;
  repeated ProcessRef pids = 6;
}
message ListProgramsRequest {}
message ListProgramsResponse { repeated ProgramInfo programs = 1; }

// DumpProgram returns the translated (xlated) instruction listing of a program,
// like `bpftool prog dump xlated`. The kernel only exposes xlated instructions
// with sufficient privilege (CAP_SYS_ADMIN) and when not disabled by
// kernel.kptr_restrict / bpf_jit_harden; available=false with a note otherwise.
message DumpProgramRequest { uint32 id = 1; }
message DumpProgramResponse {
  repeated string lines = 1; // one formatted instruction per line
  bool available = 2;
  string note = 3;           // reason when unavailable
}

message LinkInfo {
  uint32 id = 1;
  string type = 2;
  uint32 prog_id = 3;
  string attach = 4;       // attach point / target, best-effort
}
message ListLinksRequest {}
message ListLinksResponse { repeated LinkInfo links = 1; }

// TraceLog streams the node's kernel tracing pipe (tracefs trace_pipe), the
// same source as `bpftool prog tracelog` - where bpf_trace_printk() output
// lands.
//
// Reading trace_pipe CONSUMES it: the node has a single global trace buffer,
// and every line this stream delivers is gone for any other reader on that
// node. The agent therefore keeps at most one reader open, shared by all
// clients, and only while at least one client is streaming.
message TraceLogRequest {}

message TraceLogEvent {
  string line = 1;    // one trace_pipe line, newline stripped
  uint64 dropped = 2; // lines dropped for this client since the previous event
}

// ResolveInode answers the question a BPF map full of inode numbers raises:
// which file is this? The kernel offers no inode -> path call, so the agent
// searches the two places on a node that already record both an inode and a
// path - open file descriptors and mapped files, read from /proc.
//
// That bounds what an answer can mean. A hit is a file some process has open or
// mapped RIGHT NOW. A miss is "nothing holds it at this moment", never "no such
// file": a file nobody has open is invisible to this search, and so is one whose
// holder exited between the map write and the lookup.
//
// Requires the agent to see host PIDs (hostPID), like ProcessRef.
message ResolveInodeRequest {
  uint64 inode = 1;
  // Optional "major:minor" (decimal) filter. An inode number is unique only
  // within a filesystem, so an unfiltered lookup can match unrelated files on
  // different devices - each match names its own device to make that visible.
  string device = 2;
  // Also walk the filesystem, which finds a file nothing holds - the case the
  // /proc search cannot see at all. This is `find -inum`: minutes of stat calls
  // on a large tree, so it runs only when asked for, never as a fallback.
  bool walk = 3;
  // Where the walk starts. Empty means the host's root. The walk never crosses
  // onto another filesystem, since the same inode number there is a different
  // file - so a device narrows the start point to that device's mount, and an
  // explicit root is the way to search a filesystem the default misses.
  string walk_root = 4;
  // How long the walk may run before giving up and returning what it has. Zero
  // means the agent's default.
  uint32 walk_seconds = 5;
}

// WalkStats says what the filesystem walk actually did, so a result that found
// nothing can be told apart from one that ran out of time - and so the cost of
// the answer is visible.
message WalkStats {
  bool ran = 1;
  string root = 2;      // where it started, as a path on the host
  string device = 3;    // the one filesystem it stayed on
  uint64 dirs = 4;
  uint64 files = 5;     // entries whose inode was checked
  bool timed_out = 6;   // gave up with tree left to search
  double seconds = 7;
  string note = 8;      // why it could not run, when ran is false
}

// InodeHolder is one process holding a path open or mapped.
message InodeHolder {
  uint32 pid = 1;
  string comm = 2;
  // How this process was found to hold it: "fd" (an open file descriptor, with
  // fd naming it) or "map" (a file-backed memory mapping).
  string source = 3;
  string fd = 4;
}

// InodeMatch is one path found for the inode, with every process holding it.
// Paths are grouped rather than repeated per process: one shared library can be
// mapped by every process on the node, and that is one answer, not four hundred.
message InodeMatch {
  string path = 1;
  string device = 2;   // "major:minor" of the filesystem the inode lives on
  string mount = 3;    // mount point for device, empty when not resolvable
  bool deleted = 4;    // unlinked; the holder keeps it alive
  // The path is as the holder sees it. When the holder lives in another mount
  // namespace (a container), that path does not exist on the host - reach it at
  // /proc/<pid>/root<path> instead. host_path carries that form, and is empty
  // when the holder shares the host's root.
  string host_path = 5;
  repeated InodeHolder holders = 6;
  // Found by walking the filesystem rather than by a process holding it. Such a
  // match has no holders: it is a file on disk that nothing has open.
  bool from_walk = 7;
}

message ResolveInodeResponse {
  repeated InodeMatch matches = 1;
  // How many processes the answer is based on. Zero means /proc was unreadable
  // or empty - a miss says nothing at all, and the UI should say so rather than
  // report "not found".
  uint32 processes_scanned = 2;
  WalkStats walk = 3;
}

// DescribeProcess reports what /proc knows about one pid: the other half of the
// same question, since BPF maps key on pid/tgid as often as on inode.
message DescribeProcessRequest { uint32 pid = 1; }

message DescribeProcessResponse {
  bool found = 1;      // false when the pid is gone or /proc is not visible
  uint32 pid = 2;
  string comm = 3;
  string state = 4;    // the /proc/<pid>/status letter and word, e.g. "S (sleeping)"
  uint32 ppid = 5;
  string uid = 6;      // real UID
  string cmdline = 7;  // NUL separators rendered as spaces
  string exe = 8;      // resolved /proc/<pid>/exe, empty when not readable
  string cgroup = 9;   // unified (v2) cgroup path, the one k8s pods carry
  repeated Namespace namespaces = 10; // what /proc/<pid>/ns links to
  // The pid this process has in each pid namespace, outermost first: the number
  // the agent sees, then the one it goes by inside each namespace below - the
  // number `ps` prints in the container. One entry for a process in the agent's
  // own namespace, and none on a kernel too old to report them.
  repeated uint32 ns_pids = 11;
}

// DescribeNode reports the node's own configuration: the kernel, the cgroup
// hierarchy containers are accounted in, and the processes that create them.
//
// It is the context every other answer is read against. A pid or a cgroup id out
// of a BPF map only becomes a container through these: the cgroup driver decides
// the shape of the path a container id has to be parsed out of, and the cgroup
// version decides what bpf_get_current_cgroup_id() even refers to.
//
// Everything here is read from /proc and from the runtime binaries themselves.
// The agent runs nothing and asks no runtime over CRI, so a component's version
// is what its own binary records - see Component.
message DescribeNodeRequest {}

message DescribeNodeResponse {
  Kernel kernel = 1;
  Cgroups cgroups = 2;
  // The container-runtime and kubelet processes found on the node, by comm.
  repeated Component components = 3;
}

// Kernel is what uname reports, plus the node's OS image. Namespaces do not
// touch the uname fields - the kernel is the kernel, whoever asks - but the OS
// image is a file, and the agent's own is its container image rather than the
// node's, so it is read through pid 1's root and says which file answered.
message Kernel {
  string release = 1;   // uname -r, e.g. "6.12.94+deb12-arm64"
  string version = 2;   // uname -v, the build string
  string machine = 3;   // uname -m, e.g. "aarch64"
  // The agent binary's own GOARCH, e.g. "arm64" - the same architecture spelled
  // the way Go and container images spell it. A mismatch with machine means the
  // agent is not built for the node it is reading.
  string arch = 4;
  string os_image = 5;  // PRETTY_NAME from os-release
  string os_source = 6; // the file os_image was read from
}

// Cgroups says which hierarchy the node runs and how the kubelet names paths in
// it - the two facts container resolution rests on, and the two that go wrong
// quietly, since a path parsed for the other driver yields a container id that
// matches nothing rather than an error.
message Cgroups {
  string mode = 1;          // "unified" (v2), "legacy" (v1), "hybrid"
  string mode_source = 2;   // the mount table it was read from
  string driver = 3;        // "systemd", "cgroupfs", empty when nothing said
  // What settled the driver - a kubelet flag, its config file, or the shape of
  // the pod paths - and what disagrees with it, when something does.
  string driver_source = 4;
  string agent_path = 5;    // the agent's own unified (v2) cgroup path
  // One pod container's cgroup path as seen on this node, and the process it was
  // read from: the string an agent resolving containers actually has to handle.
  string example_path = 6;
  uint32 example_pid = 7;
  string example_comm = 8;
  // Whether the agent is in a cgroup namespace of its own - which it is in the
  // DaemonSet, since a container is normally given one.
  //
  // It matters because the kernel writes the paths in /proc/<pid>/cgroup
  // relative to the READER's namespace root: an agent in a pod reads its own
  // cgroup as "/" and a pod elsewhere on the node as
  // "/../../../kubepods.slice/...", and neither string exists on the node.
  // Nothing inside that namespace says where it sits, so the paths above are
  // instead read from the node's own namespace, which the agent joins for the
  // length of the call. This flag says that was necessary.
  bool namespaced = 9;
  // Why the paths above are still the agent's own view: joining the node's
  // cgroup namespace needs CAP_SYS_ADMIN. Empty when nothing stood in the way -
  // either the agent shares the node's namespace, or it joined it.
  string namespace_note = 10;
}

// Component is one container-runtime or kubelet process on the node.
//
// The version is read out of the binary's own Go build information, through
// /proc/<pid>/exe - so it is the version of the code that is running, even if
// the package has been upgraded underneath it, and it needs no CRI socket and
// no exec. Opening another process's exe needs root, which is why an
// unprivileged agent lists a component with a note in place of a version.
message Component {
  string name = 1;    // comm, e.g. "containerd", "kubelet", "dockerd"
  uint32 pid = 2;
  string exe = 3;     // /proc/<pid>/exe, as the process's own mount namespace spells it
  string cmdline = 4;
  string version = 5;
  string version_source = 6; // the -X flag or module version it came from
  string module = 7;         // main module path, e.g. "github.com/containerd/containerd/v2"
  string go_version = 8;     // the toolchain that built it
  string note = 9;           // why there is no version
}

// Namespace is one of the namespaces a process is in - the halves a container
// is actually built from, so a pid out of a map can be placed in one.
message Namespace {
  string kind = 1;   // the /proc/<pid>/ns link name: "mnt", "net", "pid", ...
  uint64 inode = 2;  // the number in "net:[4026531840]", what lsns prints
  // Pid 1's namespace of the same kind, when there is a comparison to make:
  // zero for pid 1 itself, and when its /proc entry could not be read. A
  // different number means the process has a namespace of its own - with
  // hostPID, pid 1 is the node's init, so that is the mark of a container.
  uint64 pid1_inode = 3;
}
