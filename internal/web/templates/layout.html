{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- render fills Title; the fallback keeps a template executed directly (tests)
     from rendering an empty tab name. -->
<title>{{with .Title}}{{.}}{{else}}bpf-explorer{{end}}</title>
<!-- Fonts come from Google Fonts, which the browser (not the cluster) fetches.
     If it is unreachable the fallback stacks below keep everything monospaced
     and aligned - only the terminal lettering is lost. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
  /* ── palette ─────────────────────────────────────────────────────────────
     CGA phosphor: green terminal, cyan for data and links, amber for warnings,
     light red for errors. Committed dark theme - a phosphor terminal has no
     light mode. The look is carried by colour, uppercase display type and
     hard 1px rules only: no scanlines, no glow, no soft shadows anywhere. */
  :root {
    color-scheme: dark;

    --bg:        #050806;
    --bg-panel:  #0a1109;
    --bg-inset:  #020402;

    --fg:        #4aeb6b;
    --fg-hi:     #8bffa3;
    --fg-dim:    #38a457;

    --accent:    #55ffff;
    --warn:      #ffb000;
    --err:       #ff5555;
    --badge:     #ff55ff;

    --border:    #1e5c32;
    --border-hi: #3ba85c;

    /* One family everywhere. Headings and chrome separate themselves from
       body copy with uppercase, tracking and colour rather than a second
       face, so nothing on the page renders softer than the data does. */
    --font-mono: "Share Tech Mono", ui-monospace, SFMono-Regular, Menlo,
                 "DejaVu Sans Mono", monospace;
  }

  /* ── base ────────────────────────────────────────────────────────────── */
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 var(--font-mono);
    /* Grayscale AA instead of subpixel: light-on-dark subpixel rendering
       fringes the stems with colour, which reads as haze at this size. */
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  ::selection { background: var(--fg); color: var(--bg); }
  * { scrollbar-width: thin; scrollbar-color: var(--border-hi) var(--bg-inset); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-inset); }
  ::-webkit-scrollbar-thumb {
    background: var(--border-hi);
    border: 1px solid var(--bg);
  }

  main { padding: 1rem 1.25rem 3rem; }

  /* ── header: a DOS status bar ────────────────────────────────────────── */
  header {
    display: flex;
    gap: 1rem;
    align-items: baseline;
    flex-wrap: wrap;
    padding: .5rem 1.25rem;
    background: var(--bg-panel);
    border-bottom: 3px double var(--border-hi);
  }
  /* Chrome type runs at or below the 15px body size and leans on tracking
     and uppercase for weight - a bigger size in the same face would just
     read as shouting next to the data it labels. */
  header h1 {
    margin: 0;
    font: 400 1.35rem/1 var(--font-mono);
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  header h1 a { color: var(--fg-hi); }
  header h1 a:hover { background: none; color: #fff; }
  header .tagline { font-size: .9rem; letter-spacing: .04em; }
  header .build {
    margin-left: auto;
    font-size: .85rem;
    letter-spacing: .04em;
    padding: 0 .4rem;
    border: 1px solid var(--border);
  }

  /* ── headings: title, then a rule to the edge ────────────────────────── */
  h2 {
    display: flex;
    align-items: center;
    gap: .55rem;
    margin: 1.4rem 0 .5rem;
    font: 400 1.2rem/1.2 var(--font-mono);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--fg-hi);
  }
  h2::before { content: "\25A0"; color: var(--fg-dim); }
  h2::after {
    content: "";
    flex: 1;
    border-top: 1px solid var(--border);
  }
  hr { border: none; border-top: 3px double var(--border); margin: 1.6rem 0; }

  /* ── links: cyan, inverse video on hover like a highlighted menu item ── */
  a { color: var(--accent); text-decoration: none; }
  a:hover { background: var(--accent); color: var(--bg); }
  a:focus-visible {
    outline: 1px solid var(--fg-hi);
    outline-offset: 1px;
  }

  /* ── node picker ─────────────────────────────────────────────────────── */
  nav.nodes { display: flex; flex-wrap: wrap; gap: .35rem; }
  nav.nodes a {
    padding: .1rem .55rem;
    font: 400 .9rem/1.5 var(--font-mono);
    letter-spacing: .06em;
    color: var(--fg);
    border: 1px solid var(--border-hi);
    background: var(--bg-panel);
  }
  nav.nodes a:hover { background: var(--border); color: var(--fg-hi); }
  nav.nodes a.active {
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg-hi);
  }

  /* ── tab bar: framed DOS menu ────────────────────────────────────────── */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    margin: .6rem 0 0;
    padding: .3rem .5rem;
    background: var(--bg-panel);
    border: 1px solid var(--border);
  }
  .tabs a {
    margin: 0;
    padding: 0 .7rem;
    font: 400 .9rem/1.7 var(--font-mono);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--fg);
  }
  .tabs a:hover { background: var(--border); color: var(--fg-hi); }
  .tabs a.active {
    background: var(--fg);
    color: var(--bg);
  }
  /* The section a sub-page (a dump, a diagram) sits under. Underscored rather
     than inverse: this tab is where you are, but not what you are looking at,
     and it is the link back up. A hard inset rule, like the table row marker -
     no glow, nothing soft. */
  .tabs a.parent {
    color: var(--fg-hi);
    box-shadow: inset 0 -2px 0 var(--fg-hi);
  }

  /* ── tables ──────────────────────────────────────────────────────────── */
  /* Every table is wrapped in .scroll so a wide one - the nine-column map
     list, a dump with long hex values - scrolls in its own box instead of
     pushing the page sideways. min-width keeps columns readable rather than
     letting them squeeze into unreadable ribbons on a narrow viewport. */
  .scroll { overflow-x: auto; }
  .scroll table { min-width: 44rem; }
  table {
    border-collapse: collapse;
    width: 100%;
    margin-top: .8rem;
    border: 1px solid var(--border-hi);
  }
  th, td {
    border: 1px solid var(--border);
    padding: .2rem .5rem;
    text-align: left;
    vertical-align: top;
  }
  th {
    font: 400 .85rem/1.5 var(--font-mono);
    letter-spacing: .1em;
    text-transform: uppercase;
    background: var(--border);
    color: var(--fg-hi);
    white-space: nowrap;
  }
  tbody tr:hover {
    background: rgba(85, 255, 85, .07);
    box-shadow: inset 2px 0 0 var(--fg-hi);
  }
  /* One record read down instead of across: field names in the left column,
     values in the right. Not wrapped in .scroll - there is no third column to
     push anything sideways. */
  table.kv { width: auto; min-width: min(100%, 34rem); }
  table.kv th { width: 8rem; }

  /* ── code and dumps ──────────────────────────────────────────────────── */
  code { color: var(--accent); word-break: break-all; }
  code[title] {
    text-decoration: underline dotted var(--warn);
    text-underline-offset: .2em;
    cursor: help;
  }
  pre {
    background: var(--bg-inset);
    color: var(--fg);
    padding: .6rem .8rem;
    overflow-x: auto;
    border: 1px solid var(--border);
  }
  pre.mermaid { background: var(--bg-panel); text-align: center; }
  pre.mermaid svg { max-width: 100%; }
  /* mermaid appends its tooltip to <body> and sets background:#ffffde and
     border:1px solid #333 as INLINE styles on the element, so a plain rule
     cannot reach them - hence important on each one. Text colour is left
     unset by mermaid, which is why it inherited our green onto pale yellow.
     opacity is deliberately not touched: mermaid animates it to show/hide. */
  div.mermaidTooltip {
    background: var(--bg-panel) !important;
    color: var(--fg-hi) !important;
    border: 1px solid var(--border-hi) !important;
    border-radius: 0 !important;
    padding: .2rem .45rem !important;
    font: 13px/1.4 var(--font-mono) !important;
    /* Hard offset instead of a blur, so the tooltip stays as crisp as the
       panels underneath it. */
    box-shadow: 3px 3px 0 var(--bg-inset);
  }

  /* ── forms: bracketed terminal buttons ───────────────────────────────── */
  /* A row of controls: the trace log's buttons, a lookup form's fields. */
  .controls { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  /* Label and field travel together, so a wrapping row never leaves a field
     under someone else's name. */
  .controls label {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    font-size: .9rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }
  button, input {
    font: 400 .9rem/1.5 var(--font-mono);
    letter-spacing: .08em;
    color: var(--fg);
    background: var(--bg-panel);
    border: 1px solid var(--border-hi);
    padding: .15rem .5rem;
  }
  button { text-transform: uppercase; cursor: pointer; }
  button::before { content: "[\00a0"; }
  button::after { content: "\00a0]"; }
  button:hover {
    background: var(--fg);
    color: var(--bg);
  }
  button:focus-visible, input:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: 1px;
  }
  input::placeholder { color: var(--fg-dim); opacity: 1; }

  pre.tracelog {
    height: 60vh;
    overflow: auto;
    /* Lines arrive at the top. The browser's scroll anchoring would compensate
       for that on its own in some engines and not in others (Safari has none),
       so it is off and the script does the one adjustment everywhere. */
    overflow-anchor: none;
    white-space: pre-wrap;
    word-break: break-all;
    margin: 0;
    line-height: 1.4;
  }
  /* Wrapping off: one screen line per trace line, so the left edge reads as a
     column and a long line runs off to the right instead of pushing the next
     one down. The pre already scrolls in both directions. */
  pre.tracelog.nowrap {
    white-space: pre;
    word-break: normal;
  }
  /* Arrival time, dimmed: it is scaffolding around the line, not part of it. */
  pre.tracelog .ts { color: var(--fg-dim); }
  pre.tracelog.no-time .ts { display: none; }

  /* ── xlated program dump ─────────────────────────────────────────────── */
  /* A listing is a wall of near-identical lines, so only what carries meaning
     is coloured: the function, the helper a call lands in, the map it loads.
     The bookkeeping columns recede, and the C source it was compiled from sits
     a shade back from the instructions it produced. */
  pre.xlated { line-height: 1.45; }
  pre.xlated .fn { color: var(--fg-hi); }
  pre.xlated .cmt { color: var(--fg-dim); }
  pre.xlated .off, pre.xlated .op { color: var(--fg-dim); }
  /* Not the link colour: a helper is a name worth spotting, not somewhere to
     go, and a map reference next to it is. */
  pre.xlated .helper { color: var(--warn); }
  /* A hex value holds its decimal in a tooltip, marked the way code[title] is:
     dotted underline, dimmed, since the value itself is already the text. */
  pre.xlated .hex {
    text-decoration: underline dotted var(--fg-dim);
    text-underline-offset: .2em;
    cursor: help;
  }
  /* Whole lines go, rather than their text: hiding the text would leave the
     line behind, empty. */
  pre.xlated.no-cmt .cmt { display: none; }
  pre.xlated.no-insn .insn { display: none; }

  /* ── status utilities ────────────────────────────────────────────────── */
  .muted { color: var(--fg-dim); }
  /* An action rendered in place but deliberately inert - the dump control for a
     map that cannot be dumped. Dotted underline marks that a tooltip explains
     why, the same signal code[title] uses. */
  .disabled {
    color: var(--fg-dim);
    text-decoration: underline dotted var(--fg-dim);
    text-underline-offset: .2em;
    cursor: not-allowed;
  }
  .badge {
    font-size: .8em;
    padding: 0 .35rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    background: var(--badge);
    color: var(--bg);
  }
  .err {
    color: var(--err);
    border: 1px solid var(--err);
    background: rgba(255, 85, 85, .08);
    padding: .35rem .6rem;
  }
  .err::before { content: "!! "; }
  .warn {
    border-left: 3px solid var(--warn);
    background: rgba(255, 176, 0, .07);
    padding: .5rem .7rem;
    color: var(--warn);
  }
  .warn code { color: var(--fg-hi); }

  @media (max-width: 640px) {
    main { padding: .75rem .75rem 2rem; }
    header { padding: .5rem .75rem; }
    header .build { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="/">🐝 bpf-explorer</a></h1>
  <span class="muted tagline">read-only eBPF inspector</span>
  <span class="muted build" title="build version (tag and git SHA-1)">{{version}}</span>
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>{{end}}
