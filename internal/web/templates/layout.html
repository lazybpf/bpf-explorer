{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bpf-explorer</title>
<!-- Fonts come from Google Fonts, which the browser (not the cluster) fetches.
     If it is unreachable the fallback stacks below keep everything monospaced
     and aligned - only the CRT lettering is lost. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap">
<style>
  /* ── palette ─────────────────────────────────────────────────────────────
     CGA phosphor: green terminal, cyan for data and links, amber for warnings,
     light red for errors. Committed dark theme - a P1 CRT has no light mode. */
  :root {
    color-scheme: dark;

    --bg:        #050806;
    --bg-panel:  #0a1109;
    --bg-inset:  #020402;

    --fg:        #4aeb6b;
    --fg-hi:     #8bffa3;
    --fg-dim:    #38a457;

    --accent:    #55ffff;
    --warn:      #ffb000;
    --err:       #ff5555;
    --badge:     #ff55ff;

    --border:    #1e5c32;
    --border-hi: #3ba85c;

    /* ── CRT intensity ──────────────────────────────────────────────────
       How much analog haze sits over the screen. Every knob here can go to
       0 for a flat, perfectly sharp panel - the phosphor palette and the
       VT323 / Share Tech Mono pairing carry the look without any of it. */
    --scan-alpha:  .09;  /* darkness of one scanline */
    --scan-gap:    3px;  /* clear rows between scanlines */
    --scan-pitch:  4px;  /* period; gap..pitch is the dark band */
    --vignette:    .32;  /* corner falloff at the very edge */
    --vignette-in: 68%;  /* radius where that falloff begins */
    --glow:      0 0 2px rgba(85, 255, 85, .10);
    --glow-hi:   0 0 5px rgba(85, 255, 85, .20);

    --font-display: "VT323", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --font-data: "Share Tech Mono", ui-monospace, SFMono-Regular, Menlo,
                 "DejaVu Sans Mono", monospace;
  }

  /* ── CRT shell ───────────────────────────────────────────────────────────
     Scanlines and a vignette float above the page; pointer-events:none keeps
     every link, cell and mermaid node clickable through them. */
  html { background: var(--bg); }
  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  body::before {
    z-index: 9999;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0 var(--scan-gap),
      rgba(0, 0, 0, var(--scan-alpha)) var(--scan-gap) var(--scan-pitch));
  }
  body::after {
    z-index: 9998;
    background: radial-gradient(125% 125% at 50% 50%,
      transparent var(--vignette-in), rgba(0, 0, 0, var(--vignette)) 100%);
  }
  /* On a hidpi panel a 4px CSS period is 8 device pixels - chunky enough to
     read as interference. Halve it so the lines resolve as fine texture. */
  @media (min-resolution: 2dppx) {
    :root { --scan-gap: 1.5px; --scan-pitch: 2px; }
  }

  /* ── base ────────────────────────────────────────────────────────────── */
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 var(--font-data);
    text-shadow: var(--glow);
    /* Grayscale AA instead of subpixel: light-on-dark subpixel rendering
       fringes the stems with colour, which reads as haze at this size. */
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  ::selection { background: var(--fg); color: var(--bg); text-shadow: none; }
  * { scrollbar-width: thin; scrollbar-color: var(--border-hi) var(--bg-inset); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-inset); }
  ::-webkit-scrollbar-thumb {
    background: var(--border-hi);
    border: 1px solid var(--bg);
  }

  main { padding: 1rem 1.25rem 3rem; }

  /* ── header: a DOS status bar ────────────────────────────────────────── */
  header {
    display: flex;
    gap: 1rem;
    align-items: baseline;
    flex-wrap: wrap;
    padding: .5rem 1.25rem;
    background: var(--bg-panel);
    border-bottom: 3px double var(--border-hi);
  }
  header h1 {
    margin: 0;
    font: 400 1.65rem/1 var(--font-display);
    letter-spacing: .05em;
    text-transform: uppercase;
    text-shadow: var(--glow-hi);
  }
  header h1 a { color: var(--fg-hi); }
  header h1 a:hover { background: none; color: #fff; }
  header .tagline { font-family: var(--font-display); font-size: 1.15rem; }
  header .build {
    margin-left: auto;
    font-family: var(--font-display);
    font-size: 1.1rem;
    padding: 0 .4rem;
    border: 1px solid var(--border);
  }
  .cursor { animation: blink 1.1s step-end infinite; color: var(--fg-hi); }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── headings: title, then a rule to the edge ────────────────────────── */
  h2 {
    display: flex;
    align-items: center;
    gap: .55rem;
    margin: 1.4rem 0 .5rem;
    font: 400 1.75rem/1.15 var(--font-display);
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--fg-hi);
    text-shadow: var(--glow-hi);
  }
  h2::before { content: "\25A0"; color: var(--fg-dim); }
  h2::after {
    content: "";
    flex: 1;
    border-top: 1px solid var(--border);
  }
  hr { border: none; border-top: 3px double var(--border); margin: 1.6rem 0; }

  /* ── links: cyan, inverse video on hover like a highlighted menu item ── */
  a { color: var(--accent); text-decoration: none; }
  a:hover { background: var(--accent); color: var(--bg); text-shadow: none; }
  a:focus-visible {
    outline: 1px solid var(--fg-hi);
    outline-offset: 1px;
  }

  /* ── node picker ─────────────────────────────────────────────────────── */
  nav.nodes { display: flex; flex-wrap: wrap; gap: .35rem; }
  nav.nodes a {
    padding: .05rem .55rem;
    font: 400 1.2rem/1.5 var(--font-display);
    letter-spacing: .05em;
    color: var(--fg);
    border: 1px solid var(--border-hi);
    background: var(--bg-panel);
  }
  nav.nodes a:hover { background: var(--border); color: var(--fg-hi); }
  nav.nodes a.active {
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg-hi);
    text-shadow: none;
    box-shadow: var(--glow-hi);
  }

  /* ── tab bar: framed DOS menu ────────────────────────────────────────── */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    margin: .6rem 0 0;
    padding: .3rem .5rem;
    background: var(--bg-panel);
    border: 1px solid var(--border);
  }
  .tabs a {
    margin: 0;
    padding: 0 .7rem;
    font: 400 1.2rem/1.6 var(--font-display);
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--fg);
  }
  .tabs a:hover { background: var(--border); color: var(--fg-hi); }
  .tabs a.active {
    background: var(--fg);
    color: var(--bg);
    text-shadow: none;
  }

  /* ── tables ──────────────────────────────────────────────────────────── */
  /* Every table is wrapped in .scroll so a wide one - the nine-column map
     list, a dump with long hex values - scrolls in its own box instead of
     pushing the page sideways. min-width keeps columns readable rather than
     letting them squeeze into unreadable ribbons on a narrow viewport. */
  .scroll { overflow-x: auto; }
  .scroll table { min-width: 44rem; }
  table {
    border-collapse: collapse;
    width: 100%;
    margin-top: .8rem;
    border: 1px solid var(--border-hi);
  }
  th, td {
    border: 1px solid var(--border);
    padding: .2rem .5rem;
    text-align: left;
    vertical-align: top;
  }
  th {
    font: 400 1.2rem/1.4 var(--font-display);
    letter-spacing: .07em;
    text-transform: uppercase;
    background: var(--border);
    color: var(--fg-hi);
    white-space: nowrap;
  }
  tbody tr:hover {
    background: rgba(85, 255, 85, .07);
    box-shadow: inset 2px 0 0 var(--fg-hi);
  }

  /* ── code and dumps ──────────────────────────────────────────────────── */
  code { color: var(--accent); word-break: break-all; }
  code[title] {
    text-decoration: underline dotted var(--warn);
    text-underline-offset: .2em;
    cursor: help;
  }
  pre {
    background: var(--bg-inset);
    color: var(--fg);
    padding: .6rem .8rem;
    overflow-x: auto;
    border: 1px solid var(--border);
    box-shadow: inset 0 0 16px rgba(0, 0, 0, .5);
  }
  pre.mermaid { background: var(--bg-panel); text-align: center; }
  pre.mermaid svg { max-width: 100%; }
  /* mermaid appends its tooltip to <body> and sets background:#ffffde and
     border:1px solid #333 as INLINE styles on the element, so a plain rule
     cannot reach them - hence important on each one. Text colour is left
     unset by mermaid, which is why it inherited our green onto pale yellow.
     opacity is deliberately not touched: mermaid animates it to show/hide. */
  div.mermaidTooltip {
    background: var(--bg-panel) !important;
    color: var(--fg-hi) !important;
    border: 1px solid var(--border-hi) !important;
    border-radius: 0 !important;
    padding: .2rem .45rem !important;
    font: 13px/1.4 var(--font-data) !important;
    text-shadow: none;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .7);
  }

  /* ── forms: bracketed terminal buttons ───────────────────────────────── */
  .tracectl { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  button, input {
    font: 400 1.2rem/1.5 var(--font-display);
    letter-spacing: .06em;
    color: var(--fg);
    background: var(--bg-panel);
    border: 1px solid var(--border-hi);
    padding: .05rem .5rem;
  }
  button { text-transform: uppercase; cursor: pointer; }
  button::before { content: "[\00a0"; }
  button::after { content: "\00a0]"; }
  button:hover {
    background: var(--fg);
    color: var(--bg);
    text-shadow: none;
  }
  button:focus-visible, input:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: 1px;
  }
  input::placeholder { color: var(--fg-dim); opacity: 1; }

  pre.tracelog {
    height: 60vh;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-all;
    margin: 0;
    line-height: 1.4;
  }

  /* ── status utilities ────────────────────────────────────────────────── */
  .muted { color: var(--fg-dim); }
  .badge {
    font-size: .8em;
    padding: 0 .35rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    background: var(--badge);
    color: var(--bg);
    text-shadow: none;
  }
  .err {
    color: var(--err);
    border: 1px solid var(--err);
    background: rgba(255, 85, 85, .08);
    padding: .35rem .6rem;
  }
  .err::before { content: "!! "; }
  .warn {
    border-left: 3px solid var(--warn);
    background: rgba(255, 176, 0, .07);
    padding: .5rem .7rem;
    color: var(--warn);
  }
  .warn code { color: var(--fg-hi); }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
  @media (max-width: 640px) {
    main { padding: .75rem .75rem 2rem; }
    header { padding: .5rem .75rem; }
    header .build { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="/">🐝 bpf-explorer</a></h1>
  <span class="muted"><span class="tagline">read-only eBPF inspector</span><span class="cursor" aria-hidden="true">█</span></span>
  <span class="muted build" title="build version (tag and git SHA-1)">{{version}}</span>
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>{{end}}
